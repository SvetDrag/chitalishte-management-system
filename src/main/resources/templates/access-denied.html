<!DOCTYPE html>
<html lang="bg" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Отказан достъп</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6 text-center">
            <h2 class="text-danger mb-3">403 – Достъпът е отказан</h2>
            <p class="text-muted" th:if="${currentUser != null}">
                Съжаляваме, <b th:text="${currentUser.firstName}"></b> — ролята ви
                (<span th:text="${currentUser.role.name()}"></span>) няма права за достъп до тази страница.
            </p>
            <p class="text-muted" th:if="${currentUser == null}">Нямате необходимите права за достъп до тази страница.</p>
            <a href="/home" class="btn btn-primary mt-2">Към таблото</a>
        </div>
    </div>
</div>
</body>
</html>
