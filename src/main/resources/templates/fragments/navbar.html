<!DOCTYPE html>
<html lang="bg" xmlns:th="http://www.thymeleaf.org">
<body>

<nav th:fragment="navigation(activePage)" class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm py-2">
    <div class="container-fluid px-3 px-lg-4">
        <a class="navbar-brand fw-bold fs-5 text-nowrap" href="/home">НЧ "Бялата лястовица - 2018"</a>

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav me-auto align-items-lg-center flex-wrap gap-lg-2 py-2 py-lg-0">

                <li class="nav-item">
                    <a class="nav-link fs-6 transition-all"
                       th:classappend="${activePage == 'events' ? 'text-white fw-bold border-bottom border-2 border-white' : 'text-white opacity-75'}"
                       href="/events">Събития</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link fs-6 transition-all"
                       th:classappend="${activePage == 'courses' ? 'text-white fw-bold border-bottom border-2 border-white' : 'text-white opacity-75'}"
                       href="/courses">Школи</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link fs-6 transition-all"
                       th:classappend="${activePage == 'inventory' ? 'text-white fw-bold border-bottom border-2 border-white' : 'text-white opacity-75'}"
                       href="/inventory">Инвентар</a>
                </li>

                <li class="nav-item" th:if="${currentUser != null and (currentUser.role.name() == 'EMPLOYEE' or currentUser.role.name() == 'ADMIN')}">
                    <a class="nav-link fw-bold bg-light text-primary rounded-pill px-3 ms-lg-3 shadow-sm text-nowrap"
                       href="/employee/schedule">👨‍🏫 Преподавател</a>
                </li>

                <li class="nav-item" th:if="${currentUser != null and currentUser.role.name() == 'ADMIN'}">
                    <a class="nav-link fw-bold bg-warning text-dark rounded-pill px-3 ms-lg-2 shadow-sm text-nowrap"
                       href="/users/admin/users">⚙️ Админ</a>
                </li>

                <li class="nav-item" th:if="${currentUser != null and currentUser.role.name() == 'ADMIN'}">
                    <a class="nav-link fw-bold bg-light text-primary rounded-pill px-3 ms-lg-2 shadow-sm text-nowrap"
                       href="/admin/rentals">🏛️ Наеми</a>
                </li>

                <li class="nav-item" th:if="${currentUser != null and currentUser.role.name() == 'ADMIN'}">
                    <a class="nav-link fw-bold bg-light text-primary rounded-pill px-3 ms-lg-2 shadow-sm text-nowrap"
                       href="/admin/finances">💰 Финанси</a>
                </li>
            </ul>

            <div class="d-flex align-items-center flex-wrap gap-2 mt-3 mt-lg-0" th:if="${currentUser != null}">
                <a href="/users/profile" class="text-white fs-6 text-decoration-none text-nowrap">Здравей, <b th:text="${currentUser.firstName}"></b>!</a>
                <form th:action="@{/users/logout}" th:method="POST" class="d-inline">
                    <button type="submit" class="btn btn-danger btn-sm fw-bold rounded-pill px-3 shadow-sm">Изход</button>
                </form>
            </div>
            <div class="mt-3 mt-lg-0" th:if="${currentUser == null}">
                <a href="/users/login" class="btn btn-outline-light btn-sm fw-bold rounded-pill px-3">Вход</a>
            </div>
        </div>
    </div>
</nav>

</body>
</html>
