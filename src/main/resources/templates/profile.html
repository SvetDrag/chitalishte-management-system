<!DOCTYPE html>
<html lang="bg" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Моят профил</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<nav th:replace="~{fragments/navbar :: navigation('profile')}"></nav>

<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <h2 class="text-center mb-4">Моят профил</h2>

            <div th:if="${profileUpdated}" class="alert alert-success text-center">
                Профилът е обновен успешно!
            </div>

            <form th:action="@{/users/profile}" th:method="POST" th:object="${userProfileEditDTO}" class="card p-4 shadow-sm">

                <div class="mb-3">
                    <label class="form-label">Потребителско име</label>
                    <input type="text" class="form-control" th:value="${currentUser.username}" disabled>
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label for="firstName" class="form-label">Име</label>
                        <input type="text" id="firstName" th:field="*{firstName}" class="form-control" th:classappend="${#fields.hasErrors('firstName')} ? 'is-invalid'">
                        <div class="invalid-feedback" th:errors="*{firstName}">Грешка</div>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label for="lastName" class="form-label">Фамилия</label>
                        <input type="text" id="lastName" th:field="*{lastName}" class="form-control" th:classappend="${#fields.hasErrors('lastName')} ? 'is-invalid'">
                        <div class="invalid-feedback" th:errors="*{lastName}">Грешка</div>
                    </div>
                </div>

                <div class="mb-3">
                    <label for="email" class="form-label">Имейл адрес</label>
                    <input type="email" id="email" th:field="*{email}" class="form-control" th:classappend="${#fields.hasErrors('email')} ? 'is-invalid'">
                    <div class="invalid-feedback" th:errors="*{email}">Грешка</div>
                </div>

                <button type="submit" class="btn btn-primary w-100 mt-2">Запази промените</button>
            </form>
        </div>
    </div>
</div>
</body>
</html>
