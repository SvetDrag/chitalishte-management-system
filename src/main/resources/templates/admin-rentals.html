<!DOCTYPE html>
<html lang="bg" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Наеми на залата - НЧ Бялата лястовица</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav th:replace="~{fragments/navbar :: navigation('rentals')}"></nav>

<div class="container mt-5">
    <h2 class="mb-4">Наеми на залата и техника</h2>

    <div th:if="${successMsg}" class="alert alert-success fw-bold text-center" th:text="${successMsg}"></div>
    <div th:if="${errorMsg}" class="alert alert-danger fw-bold text-center" th:text="${errorMsg}"></div>

    <div class="row mb-4">
        <div class="col-md-6 mb-4 mb-md-0">
            <div class="card shadow-sm h-100">
                <div class="card-header fw-bold">Зали</div>
                <div class="card-body">
                    <form th:action="@{/admin/rentals/halls/add}" th:method="POST" th:object="${hallCreateDTO}" class="row g-2 mb-3">
                        <div class="col-5">
                            <input type="text" th:field="*{name}" class="form-control form-control-sm" placeholder="Име на залата">
                        </div>
                        <div class="col-3">
                            <input type="number" th:field="*{capacity}" class="form-control form-control-sm" placeholder="Капацитет">
                        </div>
                        <div class="col-4">
                            <input type="text" th:field="*{description}" class="form-control form-control-sm" placeholder="Описание (по избор)">
                        </div>
                        <div class="col-12">
                            <button type="submit" class="btn btn-success btn-sm w-100">+ Добави зала</button>
                        </div>
                    </form>
                    <ul class="list-group list-group-flush">
                        <li class="list-group-item d-flex justify-content-between align-items-center" th:each="hall : ${allHalls}">
                            <span><b th:text="${hall.name}"></b> — <span th:text="${hall.capacity}"></span> места</span>
                            <form th:action="@{/admin/rentals/halls/{id}/delete(id=${hall.id})}" th:method="POST">
                                <button type="submit" class="btn btn-outline-danger btn-sm">Изтрий</button>
                            </form>
                        </li>
                        <li class="list-group-item text-muted" th:if="${allHalls.isEmpty()}">Все още няма добавени зали.</li>
                    </ul>
                </div>
            </div>
        </div>

        <div class="col-md-6">
            <div class="card shadow-sm h-100">
                <div class="card-header fw-bold">Техника за наем</div>
                <div class="card-body">
                    <form th:action="@{/admin/rentals/equipment/add}" th:method="POST" th:object="${equipmentItemCreateDTO}" class="row g-2 mb-3">
                        <div class="col-6">
                            <input type="text" th:field="*{name}" class="form-control form-control-sm" placeholder="Име на техника">
                        </div>
                        <div class="col-4">
                            <input type="number" step="0.01" th:field="*{pricePerRental}" class="form-control form-control-sm" placeholder="Цена (лв.)">
                        </div>
                        <div class="col-2">
                            <button type="submit" class="btn btn-success btn-sm w-100">+</button>
                        </div>
                    </form>
                    <ul class="list-group list-group-flush">
                        <li class="list-group-item d-flex justify-content-between align-items-center" th:each="item : ${allEquipment}">
                            <span th:text="${item.name + ' — ' + item.pricePerRental + ' лв.'}"></span>
                            <form th:action="@{/admin/rentals/equipment/{id}/delete(id=${item.id})}" th:method="POST">
                                <button type="submit" class="btn btn-outline-danger btn-sm">Изтрий</button>
                            </form>
                        </li>
                        <li class="list-group-item text-muted" th:if="${allEquipment.isEmpty()}">Все още няма добавена техника.</li>
                    </ul>
                </div>
            </div>
        </div>
    </div>

    <div class="card shadow-sm mb-4">
        <div class="card-header fw-bold">Нова заявка за наем</div>
        <div class="card-body">
            <form th:action="@{/admin/rentals/add}" th:method="POST" th:object="${rentalRequestCreateDTO}">
                <div class="row">
                    <div class="col-md-4 mb-3">
                        <label class="form-label">Зала</label>
                        <select th:field="*{hallId}" class="form-select" th:classappend="${#fields.hasErrors('hallId')} ? 'is-invalid'">
                            <option value="" disabled selected>Изберете зала...</option>
                            <option th:each="hall : ${allHalls}" th:value="${hall.id}" th:text="${hall.name}"></option>
                        </select>
                        <div class="invalid-feedback" th:errors="*{hallId}"></div>
                    </div>
                    <div class="col-md-4 mb-3">
                        <label class="form-label">Име на наемателя</label>
                        <input type="text" th:field="*{renterName}" class="form-control" th:classappend="${#fields.hasErrors('renterName')} ? 'is-invalid'">
                        <div class="invalid-feedback" th:errors="*{renterName}"></div>
                    </div>
                    <div class="col-md-4 mb-3">
                        <label class="form-label">Телефон</label>
                        <input type="text" th:field="*{renterPhone}" class="form-control" th:classappend="${#fields.hasErrors('renterPhone')} ? 'is-invalid'">
                        <div class="invalid-feedback" th:errors="*{renterPhone}"></div>
                    </div>
                </div>
                <div class="row">
                    <div class="col-md-4 mb-3">
                        <label class="form-label">Имейл</label>
                        <input type="email" th:field="*{renterEmail}" class="form-control" th:classappend="${#fields.hasErrors('renterEmail')} ? 'is-invalid'">
                        <div class="invalid-feedback" th:errors="*{renterEmail}"></div>
                    </div>
                    <div class="col-md-2 mb-3">
                        <label class="form-label">Начало</label>
                        <input type="datetime-local" th:field="*{startDateTime}" class="form-control" th:classappend="${#fields.hasErrors('startDateTime')} ? 'is-invalid'">
                        <div class="invalid-feedback" th:errors="*{startDateTime}"></div>
                    </div>
                    <div class="col-md-2 mb-3">
                        <label class="form-label">Край</label>
                        <input type="datetime-local" th:field="*{endDateTime}" class="form-control" th:classappend="${#fields.hasErrors('endDateTime')} ? 'is-invalid'">
                        <div class="invalid-feedback" th:errors="*{endDateTime}"></div>
                    </div>
                    <div class="col-md-2 mb-3">
                        <label class="form-label">Цена (лв.)</label>
                        <input type="number" step="0.01" th:field="*{price}" class="form-control" th:classappend="${#fields.hasErrors('price')} ? 'is-invalid'">
                        <div class="invalid-feedback" th:errors="*{price}"></div>
                    </div>
                    <div class="col-md-2 mb-3">
                        <label class="form-label">Повод</label>
                        <input type="text" th:field="*{purpose}" class="form-control" th:classappend="${#fields.hasErrors('purpose')} ? 'is-invalid'">
                        <div class="invalid-feedback" th:errors="*{purpose}"></div>
                    </div>
                </div>
                <div class="mb-3" th:if="${!allEquipment.isEmpty()}">
                    <label class="form-label d-block">Допълнителна техника</label>
                    <div class="form-check form-check-inline" th:each="item : ${allEquipment}">
                        <input class="form-check-input" type="checkbox" th:field="*{equipmentItemIds}" th:value="${item.id}">
                        <label class="form-check-label" th:text="${item.name + ' (' + item.pricePerRental + ' лв.)'}"></label>
                    </div>
                </div>
                <button type="submit" class="btn btn-success fw-bold">Изпрати заявка</button>
            </form>
        </div>
    </div>

    <div class="table-responsive bg-white rounded shadow-sm p-3">
        <table class="table table-hover align-middle">
            <thead class="table-dark">
            <tr>
                <th>Зала</th>
                <th>Наемател</th>
                <th>Контакт</th>
                <th>Период</th>
                <th>Техника</th>
                <th>Цена</th>
                <th>Статус</th>
                <th>Действия</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="rental : ${allRentals}">
                <td th:text="${rental.hall != null ? rental.hall.name : '-'}"></td>
                <td class="fw-bold" th:text="${rental.renterName}"></td>
                <td th:text="${rental.renterPhone + ' / ' + rental.renterEmail}"></td>
                <td th:text="${#temporals.format(rental.startDateTime, 'dd.MM.yyyy HH:mm') + ' - ' + #temporals.format(rental.endDateTime, 'HH:mm')}"></td>
                <td>
                    <span th:if="${rental.equipmentItems.isEmpty()}" class="text-muted">-</span>
                    <span th:each="item, iter : ${rental.equipmentItems}" th:text="${item.name + (!iter.last ? ', ' : '')}"></span>
                </td>
                <td th:text="${rental.price + ' лв.'}"></td>
                <td>
                    <span class="badge rounded-pill"
                          th:classappend="${rental.status.name() == 'CONFIRMED' ? 'bg-success' : (rental.status.name() == 'CANCELLED' ? 'bg-danger' : (rental.status.name() == 'COMPLETED' ? 'bg-secondary' : 'bg-warning text-dark'))}"
                          th:text="${rental.status}">
                    </span>
                </td>
                <td>
                    <form th:if="${rental.status.name() == 'PENDING'}" th:action="@{/admin/rentals/{id}/confirm(id=${rental.id})}" th:method="POST" class="d-inline">
                        <button type="submit" class="btn btn-success btn-sm fw-bold">Потвърди</button>
                    </form>
                    <form th:if="${rental.status.name() == 'PENDING' or rental.status.name() == 'CONFIRMED'}" th:action="@{/admin/rentals/{id}/cancel(id=${rental.id})}" th:method="POST" class="d-inline">
                        <button type="submit" class="btn btn-warning btn-sm fw-bold">Откажи</button>
                    </form>
                    <form th:action="@{/admin/rentals/{id}/delete(id=${rental.id})}" th:method="POST" class="d-inline">
                        <button type="submit" class="btn btn-danger btn-sm fw-bold" onclick="return confirm('Изтриване на тази заявка?')">Изтрий</button>
                    </form>
                </td>
            </tr>
            <tr th:if="${allRentals.isEmpty()}">
                <td colspan="8" class="text-center text-muted p-4">Все още няма заявки за наем.</td>
            </tr>
            </tbody>
        </table>
    </div>
</div>
</body>
</html>
