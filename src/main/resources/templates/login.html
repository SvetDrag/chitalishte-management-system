<!DOCTYPE html>
<html lang="bg" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Вход</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
</head>
<body class="bg-light">

<nav class="navbar navbar-light bg-white shadow-sm">
    <div class="container">
        <a class="navbar-brand fw-bold text-primary" href="/">
            <i class="bi bi-book-half me-2"></i>НЧ "Бялата лястовица - 2018"
        </a>
    </div>
</nav>

<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-4">
            <div class="text-center mb-4">
                <i class="bi bi-person-circle text-primary" style="font-size: 3rem;"></i>
                <h2 class="mt-2">Вход в системата</h2>
            </div>

            <div th:if="${param.error}" class="alert alert-danger text-center">
                Грешно потребителско име или парола!
            </div>

            <form th:action="@{/users/login}" th:method="POST" th:object="${userLoginDTO}" class="card p-4 shadow-sm border-0 rounded-4">
                <div class="mb-3">
                    <label for="username" class="form-label fw-bold">Потребителско име</label>
                    <input type="text" id="username" th:field="*{username}" class="form-control" th:classappend="${#fields.hasErrors('username')} ? 'is-invalid'">
                    <div class="invalid-feedback" th:errors="*{username}">Грешка</div>
                </div>

                <div class="mb-3">
                    <label for="password" class="form-label fw-bold">Парола</label>
                    <input type="password" id="password" th:field="*{password}" class="form-control" th:classappend="${#fields.hasErrors('password')} ? 'is-invalid'">
                    <div class="invalid-feedback" th:errors="*{password}">Грешка</div>
                </div>

                <button type="submit" class="btn btn-primary w-100 fw-bold rounded-pill py-2">Влез</button>
                <div class="text-center mt-3">
                    <a href="/" class="text-decoration-none">Назад към началото</a>
                </div>
            </form>
        </div>
    </div>
</div>
</body>
</html>
