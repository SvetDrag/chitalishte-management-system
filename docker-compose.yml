services:
  mysql-main:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-rootpass}
      MYSQL_DATABASE: chitalishte_management_system
    ports:
      - "3306:3306"
    volumes:
      - mysql-main-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p${DB_PASSWORD:-rootpass}"]
      interval: 5s
      timeout: 5s
      retries: 10

  mysql-rental:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-rootpass}
      MYSQL_DATABASE: chitalishte_rental_db
    ports:
      - "3307:3306"
    volumes:
      - mysql-rental-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p${DB_PASSWORD:-rootpass}"]
      interval: 5s
      timeout: 5s
      retries: 10

  rental-service:
    build: ./rental-service
    depends_on:
      mysql-rental:
        condition: service_healthy
    environment:
      DB_USERNAME: root
      DB_PASSWORD: ${DB_PASSWORD:-rootpass}
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-rental:3306/chitalishte_rental_db?createDatabaseIfNotExist=true
    ports:
      - "8081:8081"

  main-app:
    build: .
    depends_on:
      mysql-main:
        condition: service_healthy
      rental-service:
        condition: service_started
    environment:
      DB_USERNAME: root
      DB_PASSWORD: ${DB_PASSWORD:-rootpass}
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-main:3306/chitalishte_management_system?createDatabaseIfNotExist=true
      RENTAL_SERVICE_URL: http://rental-service:8081
    ports:
      - "8080:8080"

volumes:
  mysql-main-data:
  mysql-rental-data:
